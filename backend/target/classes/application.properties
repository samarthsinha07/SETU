server.port=8080
spring.application.name=campus-opportunity-hub

# Database Configuration (H2 in MySQL Compatibility Mode for Zero-Config Local Setup)
spring.datasource.url=jdbc:h2:mem:campus_hub_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=Monu@0098!

# H2 Console (for viewing database state during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Database Initializer Scripts
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3a5f8e0c2b4a6d8f1e3c5b7a9d0e2f4a6b8c1d3e5f7a9b0c2d4e
app.jwt.expiration-ms=86400000
